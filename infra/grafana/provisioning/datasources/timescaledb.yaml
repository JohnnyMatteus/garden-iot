apiVersion: 1
datasources:
  - name: TimescaleDB
    uid: garden-timescaledb
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: svc_grafana
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      password: ${TELEMETRY_OPS_PASSWORD}
