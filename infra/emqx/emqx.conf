## EMQX 5 do garden-iot: somente MQTTS com mTLS, ACL por dispositivo e por serviço.
## A identidade vem do CN do certificado (ADR 0009); não há listener em texto claro.

node {
  name = "emqx@127.0.0.1"
  cookie = "garden-dev-only-cookie"
  data_dir = "data"
}

dashboard {
  listeners.http.bind = 18083
}

listeners.tcp.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 10000
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.pem"
    certfile = "/opt/emqx/etc/certs/emqx.pem"
    keyfile = "/opt/emqx/etc/certs/emqx.key"
    verify = verify_peer
    fail_if_no_peer_cert = true
    versions = ["tlsv1.3", "tlsv1.2"]
    enable_crl_check = true
  }
}

## Revogação: o EMQX baixa a CRL do Vault (endereço embutido no certificado).
crl_cache {
  refresh_interval = "1m"
  http_timeout = "5s"
  capacity = 100
}

mqtt {
  peer_cert_as_username = cn
  max_packet_size = "256KB"
}

authorization {
  no_match = deny
  deny_action = ignore
  cache.enable = false
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}
