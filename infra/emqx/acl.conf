%% ACL do garden-iot (EMQX, tipo file). Avaliada de cima para baixo; sem match, nega.
%% username = CN do certificado. Dispositivo: "<tenant>/<horta>/<no>". Serviço: "svc:<nome>".

%% Serviços, com escopo mínimo.
%% Bridge: só assina a telemetria (também como assinatura compartilhada) e nunca publica.
{allow, {username, "svc:bridge"}, subscribe, ["horta/+/+/+/telemetria", "$share/bridge/horta/+/+/+/telemetria"]}.
{deny,  {username, "svc:bridge"}, all, ["#"]}.

%% Simulador de frota: publica em nome dos nós simulados; não assina nada.
{allow, {username, "svc:fleet-sim"}, publish, ["horta/+/+/+/telemetria", "horta/+/+/+/estado", "horta/+/+/+/lwt"]}.
{deny,  {username, "svc:fleet-sim"}, all, ["#"]}.

%% API: publica comandos e assina o estado reportado e as respostas dos nós (ADR 0011).
{allow, {username, "svc:api"}, publish, ["horta/+/+/+/cmd"]}.
{allow, {username, "svc:api"}, subscribe, ["horta/+/+/+/estado", "horta/+/+/+/cmd/resposta"]}.
{deny,  {username, "svc:api"}, all, ["#"]}.

%% Irrigação: comanda a válvula e acompanha o estado reportado; nunca publica telemetria.
{allow, {username, "svc:irrigation"}, publish, ["horta/+/+/+/cmd"]}.
{allow, {username, "svc:irrigation"}, subscribe, ["horta/+/+/+/estado", "horta/+/+/+/cmd/resposta"]}.
{deny,  {username, "svc:irrigation"}, all, ["#"]}.

%% Dispositivos: o username precisa ter o formato exato tenant/horta/no, o que impede
%% curingas e injeção de segmentos no tópico. Cada nó publica só nos seus tópicos
%% e assina só o seu cmd.
{allow, {username, {re, "^[a-z0-9-]{1,32}/[a-z0-9-]{1,32}/[a-z0-9-]{1,32}$"}}, publish,
  ["horta/${username}/telemetria", "horta/${username}/estado", "horta/${username}/cmd/resposta", "horta/${username}/lwt"]}.
{allow, {username, {re, "^[a-z0-9-]{1,32}/[a-z0-9-]{1,32}/[a-z0-9-]{1,32}$"}}, subscribe,
  ["horta/${username}/cmd"]}.

{deny, all}.
