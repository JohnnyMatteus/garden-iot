name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26"
  BUF_VERSION: "1.50.0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.f.outputs.firmware }}
      bridge: ${{ steps.f.outputs.bridge }}
      irrigation: ${{ steps.f.outputs.irrigation }}
      api: ${{ steps.f.outputs.api }}
      web: ${{ steps.f.outputs.web }}
      e2e: ${{ steps.f.outputs.e2e }}
      fleet_sim: ${{ steps.f.outputs.fleet_sim }}
      contracts: ${{ steps.f.outputs.contracts }}
      infra: ${{ steps.f.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            firmware:
              - 'firmware/**'
              - 'contracts/mqtt/**'
              - '.github/workflows/ci.yml'
            bridge:
              - 'services/bridge/**'
              - 'contracts/**'
            e2e:
              - 'tests/integration/**'
              - 'services/bridge/**'
              - 'tools/fleet-sim/**'
              - 'contracts/**'
              - 'infra/**'
              - 'docker-compose.yml'
            api:
              - 'services/api/**'
              - 'contracts/**'
            web:
              - 'web/**'
            irrigation:
              - 'services/irrigation/**'
              - 'contracts/**'
            fleet_sim:
              - 'tools/fleet-sim/**'
              - 'contracts/**'
            contracts:
              - 'contracts/**'
            infra:
              - 'infra/**'
              - 'docker-compose.yml'
              - 'Makefile'
              - '.env.example'

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}
      - name: buf lint
        run: buf lint
        working-directory: contracts
      # Sem linha de base não há o que comparar: só pula quando a main ainda não tem o módulo
      # (contracts/buf.yaml). Assim que a main o tiver, o check passa a ser obrigatório.
      - name: Detecta linha de base do contrato na main
        id: baseline
        if: github.ref != 'refs/heads/main'
        run: |
          git rev-parse --verify --quiet origin/main >/dev/null || { echo "origin/main ausente no checkout"; exit 1; }
          if git cat-file -e origin/main:contracts/buf.yaml 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A main ainda não tem contracts/buf.yaml; buf breaking não tem linha de base e foi pulado."
          fi
      - name: buf breaking (contra a main)
        if: github.ref != 'refs/heads/main' && steps.baseline.outputs.present == 'true'
        run: buf breaking --against '../.git#branch=origin/main,subdir=contracts'
        working-directory: contracts
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: contracts/go.sum
      - name: Código gerado está em dia
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          buf generate
          git diff --exit-code -- gen
        working-directory: contracts
      - name: Testes do contrato
        run: go test ./... -count=1
        working-directory: contracts

  firmware-host:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes de payload, fila offline e mediana (host)
        run: make -C firmware test

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Build do firmware (ESP-IDF fixado, sdkconfig do Wokwi)
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.wokwi" set-target esp32 build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: |
            firmware/build/flasher_args.json
            firmware/build/garden-node.elf
            firmware/build/garden-node.bin
            firmware/wokwi.toml
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
          retention-days: 7

  firmware-wokwi:
    needs: [changes, firmware-host, firmware]
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-build
          path: firmware
      - name: Wokwi indisponível sem token
        if: env.WOKWI_CLI_TOKEN == ''
        run: echo "::warning::Segredo WOKWI_CLI_TOKEN não configurado; simulação pulada (PR de fork ou pendência do autor)."
      - name: Simula e espera o lote publicado
        if: env.WOKWI_CLI_TOKEN != ''
        uses: wokwi/wokwi-ci-action@v1
        with:
          path: firmware
          timeout: 120000
          expect_text: "lote publicado"
          fail_text: "Guru Meditation"
          serial_log_file: wokwi-serial.log
      - name: Anexa a saída serial
        if: always() && env.WOKWI_CLI_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: wokwi-serial
          path: wokwi-serial.log
          if-no-files-found: ignore

  bridge:
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/bridge/go.sum
      - run: go vet ./...
        working-directory: services/bridge
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: services/bridge
      - run: go test ./... -race -count=1
        working-directory: services/bridge

  bridge-integration:
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/bridge/go.sum
      - name: Integração da bridge (testcontainers)
        run: go test -tags=integration ./... -count=1
        working-directory: services/bridge

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/bridge/go.sum
            tools/fleet-sim/go.sum
            tests/integration/go.sum
      - name: Compila o teste de integração
        run: cd tests/integration && go vet -tags integration ./...
      - name: Sobe o ambiente (core)
        run: |
          cp .env.example .env
          docker compose --profile core up -d --remove-orphans
          infra/wait-healthy.sh 300
      - name: Integração ponta a ponta (bridge, persistência e fleet-sim como processos)
        run: cd tests/integration && go test -tags integration -count=1 -timeout 15m -v ./...
      - name: Logs do ambiente em caso de falha
        if: failure()
        run: docker compose --profile core logs --no-color --tail 200
      - name: Derruba o ambiente
        if: always()
        run: docker compose --profile core down -v

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/api/go.sum
      - run: go vet ./...
        working-directory: services/api
      - run: go test ./... -race -count=1
        working-directory: services/api

  irrigation:
    needs: changes
    if: needs.changes.outputs.irrigation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/irrigation/go.sum
      - run: go vet ./...
        working-directory: services/irrigation
      - run: go test ./... -race -count=1
        working-directory: services/irrigation

  fleet-sim:
    needs: changes
    if: needs.changes.outputs.fleet_sim == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/fleet-sim/go.sum
      - run: go vet ./...
        working-directory: tools/fleet-sim
      - run: go test ./... -race -count=1
        working-directory: tools/fleet-sim

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose válido em todos os profiles
        run: cp .env.example .env && make compose-check
      - name: Shellcheck
        run: shellcheck infra/vault/*.sh infra/kafka/*.sh infra/*.sh
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: infra/tests/go.sum
      - name: Sobe a stack de infraestrutura
        run: |
          cp .env.example .env
          docker compose --profile core --profile observability up -d
          infra/wait-healthy.sh 300
      - name: Provisiona nós de teste
        run: make seed
      - name: Integração (ACL do broker e RLS do banco)
        run: make test-integration
      - name: Grafana provisionou o painel
        run: |
          curl -fsS -u admin:dev-only-change-me 'http://localhost:3000/api/search?query=Telemetria' | grep -q garden-telemetria
      - name: Logs em caso de falha
        if: failure()
        run: docker compose --profile core --profile observability logs --no-color --tail=200
      - name: Derruba
        if: always()
        run: docker compose --profile core --profile observability down -v

  # Único check obrigatório: jobs pulados por paths-filter contam como sucesso.
  ci-ok:
    if: always()
    needs: [changes, contracts, firmware-host, firmware, firmware-wokwi, bridge, bridge-integration, e2e, api, web, irrigation, fleet-sim, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Falha se algum job falhou ou foi cancelado
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "há job com falha"; exit 1
          fi

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
