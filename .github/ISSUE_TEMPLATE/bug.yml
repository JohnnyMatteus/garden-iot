name: Bug
description: Algo não funciona como o esperado
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [firmware, bridge, irrigation, contracts, infra, fleet-sim, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: Comportamento observado e o esperado.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Como reproduzir
      description: Comandos (make up, make seed, ...) e passos.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Sem segredos nem chaves privadas.
      render: shell
