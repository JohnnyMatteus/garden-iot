# Ambiente local do garden-iot. Todos os serviços de infraestrutura ficam em profiles:
#   core          vault, emqx, kafka, schema-registry, timescaledb (+ jobs de bootstrap)
#   observability grafana
#   tools         kafka-ui
# Uso: `make up` (core + observability) ou `docker compose --profile core up -d`.
# Credenciais abaixo são de desenvolvimento; ver .env.example.

name: garden-iot

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

networks:
  garden:
    name: garden-iot

volumes:
  emqx-data:
  kafka-data:
  timescaledb-data:
  grafana-data:

services:
  vault:
    <<: *hardening
    image: hashicorp/vault:1.18.1
    profiles: [core]
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-change-me}
      VAULT_ADDR: http://127.0.0.1:8200
      SKIP_SETCAP: "true"
    cap_add: [IPC_LOCK]
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    networks: [garden]

  # Configura a PKI no Vault e grava CA e certificados dos serviços em infra/pki/out.
  vault-init:
    image: hashicorp/vault:1.18.1
    profiles: [core]
    depends_on:
      vault:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/bootstrap-pki.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-change-me}
      VAULT_CRL_URL: http://vault:8200/v1/pki/crl/pem
    volumes:
      - ./infra/vault:/init:ro
      - ${PKI_OUT_DIR:-./infra/pki/out}:/out
    restart: "no"
    mem_limit: 128m
    networks: [garden]

  emqx:
    <<: *hardening
    image: emqx/emqx:5.8.6
    profiles: [core]
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-dev-only-change-me}
    ports:
      - "${EMQX_MQTTS_PORT:-8883}:8883"
      - "127.0.0.1:${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - ./infra/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./infra/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ${PKI_OUT_DIR:-./infra/pki/out}:/opt/emqx/etc/certs:ro
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    networks: [garden]

  kafka:
    <<: *hardening
    image: apache/kafka:3.8.1
    profiles: [core]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    networks: [garden]

  schema-registry:
    <<: *hardening
    image: confluentinc/cp-schema-registry:7.7.1
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    ports:
      - "127.0.0.1:${SCHEMA_REGISTRY_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 512m
    networks: [garden]

  # Cria os tópicos (retenção do design doc, seção 5.2).
  kafka-init:
    image: apache/kafka:3.8.1
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./infra/kafka:/init:ro
    restart: "no"
    mem_limit: 256m
    networks: [garden]

  # Fixa BACKWARD e registra o schema Protobuf do contrato telemetria.bruta.v1.
  schema-init:
    image: curlimages/curl:8.10.1
    profiles: [core]
    depends_on:
      schema-registry:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/init-schemas.sh"]
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./infra/kafka:/init:ro
      - ./contracts/proto:/contracts/proto:ro
    restart: "no"
    mem_limit: 64m
    networks: [garden]

  timescaledb:
    <<: *hardening
    image: timescale/timescaledb:2.17.2-pg16
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garden}
      POSTGRES_USER: ${POSTGRES_USER:-garden_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      TELEMETRY_WRITER_PASSWORD: ${TELEMETRY_WRITER_PASSWORD:-dev-only-change-me}
      TELEMETRY_OPS_PASSWORD: ${TELEMETRY_OPS_PASSWORD:-dev-only-change-me}
      GARDEN_API_PASSWORD: ${GARDEN_API_PASSWORD:-dev-only-change-me}
    ports:
      - "127.0.0.1:${TIMESCALEDB_PORT:-5432}:5432"
    volumes:
      - ./infra/timescaledb/init:/docker-entrypoint-initdb.d:ro
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    networks: [garden]

  grafana:
    <<: *hardening
    image: grafana/grafana:11.3.0
    profiles: [observability]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-only-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      TELEMETRY_OPS_PASSWORD: ${TELEMETRY_OPS_PASSWORD:-dev-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-garden}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 384m
    cap_drop: [ALL]
    networks: [garden]

  kafka-ui:
    <<: *hardening
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [tools]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: garden-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8089}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    networks: [garden]
